services:

  postgres:
    image: postgres:alpine
    environment:
      POSTGRES_DB: agritech
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Master
    ports:
      - "3006:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  spring-app:
    build: .
    ports:
      - "8082:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
